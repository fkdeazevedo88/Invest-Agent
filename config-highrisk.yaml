# ---- HIGH-RISK stock agent ----
# A few individual TSX and NASDAQ stocks with the strongest recent momentum. Expect big swings:
# losing 30-50% of this money is possible. Only use money you can afford to lose.
name: HIGH-RISK agent
state_dir: state-highrisk     # its own records, separate from the ETF agent
strategy: momentum

capital_cad: 500              # Canadian dollars this agent manages (for TSX stocks)
capital_usd: 150              # US dollars it manages (for NASDAQ stocks). It never converts currency
                              # or borrows: put this many US dollars in the account yourself
                              # (moomoo app: currency exchange), or set 0 to skip NASDAQ.
                              # Both are read once, when the agent first starts; after that its own
                              # records (state-highrisk/) are what count.
max_equity_cad: 1000          # never manages more than this (US dollars counted in CAD)

momentum:
  max_positions: 4            # hold at most 4 stocks (about 25% each)
  min_price: 2.0              # no penny stocks (in CAD)
  min_dollar_volume: 2000000  # at least $2M CAD traded per day, so orders fill near the price
  stop_loss: 0.15             # sell a stock that falls 15% below its 20-day high
  research_top: 8             # how many candidates Claude researches in the news

risk:
  max_position_weight: 0.30   # no single stock above 30%
  min_trade_cad: 25
  no_trade_band: 0.05         # ignore drifts smaller than 5%
  limit_slippage: 0.005       # limit orders 0.5% through the last price
  max_drawdown: 0.40          # kill switch: down 40% from capital_cad -> sell all, halt

claude:
  enabled: true               # needs ANTHROPIC_API_KEY; otherwise the rules decide alone
  web_search: true            # Claude checks world news (economy, trade, politics between countries)
                              # and news on the candidates, on trusted news sites only
  max_searches: 15
  model: claude-opus-5-5
  effort: high

paper:
  commission_cad: 0.0

moomoo:
  host: 127.0.0.1
  port: 11111
  security_firm: FUTUCA
  account_type: MARGIN        # never borrows: buys only with real cash, never short sells
  acc_id: 0
  fill_wait_seconds: 30

# Never traded by this agent: your own stocks and the ETF agent's funds.
exclude: [ENB.TO, BN.TO, BAM.TO, BEP-UN.TO, BIP-UN.TO, VFV.TO, ZQQ.TO, XIU.TO, XEF.TO, XEC.TO, ZAG.TO, CGL-C.TO, CASH.TO]

