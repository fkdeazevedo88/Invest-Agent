# ---- Investing agent configuration ----
capital_cad: 1000          # starting money; also the baseline for the kill switch
max_equity_cad: 2000       # hard ceiling: the agent never manages more than this, even if the account holds more
rebalance_every_days: 28      # trade once every 4 weeks. Running it more often only checks the
                              # safety rules; it trades when due (or with --force). In the Nov 2026
                              # backtest, monthly beat daily and weekly for both agents.

# Everything the agent is allowed to buy. All are CAD-denominated TSX ETFs,
# so there is no currency conversion. `moomoo` is the symbol on moomoo.
universe:
  - {ticker: VFV.TO,   moomoo: CA.VFV,   name: "S&P 500 (US large cap)"}
  - {ticker: ZQQ.TO,   moomoo: CA.ZQQ,   name: "Nasdaq-100 (CAD hedged)"}
  - {ticker: XIU.TO,   moomoo: CA.XIU,   name: "S&P/TSX 60 (Canada large cap)"}
  - {ticker: XEF.TO,   moomoo: CA.XEF,   name: "International developed markets"}
  - {ticker: XEC.TO,   moomoo: CA.XEC,   name: "Emerging markets"}
  - {ticker: ZAG.TO,   moomoo: CA.ZAG,   name: "Canadian aggregate bonds"}
  - {ticker: CGL-C.TO, moomoo: CA.CGL.C, name: "Gold bullion"}
  - {ticker: CASH.TO,  moomoo: CA.CASH,  name: "High-interest savings (cash parking)"}
  # Higher-risk ETFs (added Nov 2026)
  - {ticker: XQQ.TO,   moomoo: CA.XQQ,   name: "Nasdaq-100 (CAD hedged, iShares)"}
  - {ticker: XIT.TO,   moomoo: CA.XIT,   name: "Canadian tech stocks"}
  - {ticker: XGD.TO,   moomoo: CA.XGD,   name: "Gold miners"}
cash_ticker: CASH.TO       # exempt from the per-position cap

# How the agent decides: etf_trend (the default) or pullback.
# Compare them first:  python run.py backtest --strategy all
strategy: etf_trend

# Rules for the pullback strategy, sized for ETFs. ETFs swing about half as much as
# single stocks, so the dips are about half those used for stocks in config-highrisk.yaml.
filters:
  min_price: 2.0
  min_dollar_volume: 500000   # ETFs trading at least $0.5M a day
  max_positions: 4
pullback:
  min_6m: 0.05                # only ETFs up at least 5% over 6 months
  dip_min: 0.03               # buy after a 3% to 10% drop from the 20-day high...
  dip_max: 0.10
  max_rsi: 40                 # ...when RSI says it's oversold
  recovered: 0.01             # sell once it's back within 1% of the high

risk:
  max_position_weight: 0.40   # no single ETF above 40% (except cash_ticker)
  min_trade_cad: 25           # ignore tiny trades
  no_trade_band: 0.03         # ignore drifts smaller than 3% of the portfolio
  limit_slippage: 0.003       # limit orders priced 0.3% through the last price
  max_drawdown: 0.25          # kill switch: down 25% from the starting money -> sell all, halt
  trend_buffer: 0.05          # keep an ETF it owns until it's 5% below its 200-day average
                              # (0 = sell as soon as it dips below; 5% traded 3x less and did
                              # slightly better in the Nov 2026 backtest, with a bit more risk)

claude:
  enabled: true               # needs ANTHROPIC_API_KEY; otherwise the rules strategy is used
  model: claude-opus-5-5
  effort: high

paper:
  commission_cad: 0.0         # per order, simulated

moomoo:
  host: 127.0.0.1
  port: 11111                 # OpenD gateway
  security_firm: FUTUCA       # Moomoo Financial Canada
  account_type: MARGIN        # which account the agent trades: TFSA, MARGIN, CASH, RRSP...
  acc_id: 0                   # 0 = pick the one account of account_type; set it only if you have
                              # several of that type (see: python run.py accounts)
  fill_wait_seconds: 30       # wait after sells before buying
